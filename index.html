<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كراسي – ملخصات وتمارين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f9;--grid:#d5dff0;--card:#fff;--tx:#17223a;--mut:#62708a;--bd:#d9e0ee;--pr:#243b73;--prt:#fff;--red:#d64550;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--grid:#18213a;--card:#172036;--tx:#e8edf8;--mut:#9aa7c2;--bd:#2a3654;--pr:#8aa4ff;--prt:#0e1424;--red:#ff7a85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--grid:#18213a;--card:#172036;--tx:#e8edf8;--mut:#9aa7c2;--bd:#2a3654;--pr:#8aa4ff;--prt:#0e1424;--red:#ff7a85;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Cairo",Tahoma,"Segoe UI",system-ui,sans-serif;color:var(--tx);background-color:var(--bg);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
#app{max-width:880px;margin:0 auto;padding:20px 16px 48px}
h1,h2{margin:0;font-weight:800}
button,input,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.ghost{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
/* login */
.login{max-width:420px;margin:8vh auto 0;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:28px 24px;text-align:center}
.login .logo{font-size:48px}
.login h1{font-size:28px;margin:6px 0 4px}
.login p{color:var(--mut);margin:0 0 18px}
.login select,.login input{width:100%;padding:12px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:10px}
.login .btn{width:100%;justify-content:center}
.sep{margin:18px 0 12px;color:var(--mut);font-size:14px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top small{color:var(--mut)}
.top h2{font-size:26px}
/* subjects */
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.sub{position:relative;text-align:right;background:var(--card);border:1px solid var(--bd);border-inline-start:8px solid var(--c);border-radius:14px;padding:16px 14px;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.sub:hover{border-color:var(--c)}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:800;background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--c)}
.sub b{font-size:18px}
.cnt{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:600;color:var(--mut)}
/* subject page */
.tabs{display:flex;gap:8px;margin-bottom:-2px;position:relative;z-index:1}
.tabs button{flex:1;padding:12px 10px;border:2px solid var(--bd);border-bottom:0;border-radius:12px 12px 0 0;background:var(--bg);font-weight:600;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--tx);border-color:var(--c);box-shadow:inset 0 4px 0 var(--c)}
.panel{background:var(--card);border:2px solid var(--c);border-radius:0 0 14px 14px;padding:18px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar .btn{background:var(--c);color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in;background:var(--bg)}
.gal figure{margin:0;min-width:0}
.gal figcaption{font-size:13px;font-weight:600;color:var(--mut);margin-top:5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:36px 10px;border:2px dashed var(--bd);border-radius:12px;margin:0}
/* lightbox + toast */
.lb{position:fixed;inset:0;background:rgba(5,8,18,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:78vh;border-radius:8px}
.lb .row{display:flex;gap:10px}
.lb .del{background:var(--red);color:#fff}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;max-width:380px;background:var(--red);color:#fff;padding:12px 16px;border-radius:10px;text-align:center;z-index:30}
/* ---- تحسينات الشكل ---- */
:root{--spines:linear-gradient(90deg,#2f6fed 0 11.1%,#0f9d6b 0 22.2%,#7c4dff 0 33.3%,#e08a00 0 44.4%,#d64550 0 55.5%,#0aa5c0 0 66.6%,#a0592a 0 77.7%,#3c9a2f 0 88.8%,#13867a 0)}
body{background-image:radial-gradient(900px 320px at 50% -60px,color-mix(in srgb,var(--pr) 20%,transparent),transparent),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px;background-repeat:no-repeat,repeat,repeat}
.btn{box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{box-shadow:none}
.ghost{box-shadow:0 2px 0 var(--bd)}
.sub,[style*='--c:']{--cd:color-mix(in srgb,var(--c) 80%,#000)}
/* دخول */
.login{position:relative;overflow:hidden;border-radius:24px;padding:38px 26px 28px;box-shadow:0 26px 50px -30px rgba(20,35,80,.5)}
.login::before,.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:9px;background:var(--spines)}
.login .logo{width:84px;height:84px;margin:0 auto 10px;display:grid;place-items:center;font-size:44px;border-radius:26px;background:color-mix(in srgb,var(--pr) 14%,var(--card));transform:rotate(-6deg)}
.login h1{font-size:34px;color:var(--pr)}
.login select,.login input{border-radius:12px;font-size:16px}
.login select:focus,.login input:focus{outline:none;border-color:var(--pr)}
/* الرئيسية */
.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:28px 22px 18px;box-shadow:0 18px 34px -26px rgba(20,35,80,.5);margin-bottom:22px}
.hero small{font-size:15px}
.hero h2{font-size:30px;color:var(--pr)}
.hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.sub{border-radius:18px;min-height:132px;gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 13%,var(--card)),var(--card) 60%);transition:transform .15s,box-shadow .15s}
.sub:hover{transform:translateY(-3px);box-shadow:0 14px 26px -16px var(--c)}
.ic{width:50px;height:50px;border-radius:15px;background:var(--cd);color:#fff;font-size:26px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.sub b{font-size:19px}
.cnt{gap:6px;width:100%}
.cnt span{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cnt i{font-style:normal;min-width:26px;height:26px;padding:0 7px;border-radius:99px;display:inline-grid;place-items:center;font-size:13px;font-weight:800;color:var(--tx);background:color-mix(in srgb,var(--c) 20%,var(--card))}
@media (prefers-reduced-motion:no-preference){.sub{animation:pop .4s backwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}}
/* صفحة المادة */
.banner{background:radial-gradient(circle at 12% 0,rgba(255,255,255,.22),transparent 45%),var(--cd);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:18px;box-shadow:0 14px 26px -18px var(--c)}
.banner h2{font-size:28px}
.banner .ghost{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);color:#fff;box-shadow:none}
.tabs button{font-size:15px;padding:13px 10px}
.tabs button.on{background:var(--cd);color:#fff;border-color:var(--cd);box-shadow:none}
.panel{border-color:var(--cd);border-radius:0 0 20px 20px;padding:20px}
.bar .btn{background:var(--cd);padding:12px 22px;font-size:16px}
.gal{gap:14px}
.gal figure{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 6px 8px;box-shadow:0 8px 16px -12px rgba(0,0,0,.5);transition:transform .15s}
.gal figure:nth-child(odd){transform:rotate(-.8deg)}
.gal figure:nth-child(even){transform:rotate(.8deg)}
.gal figure:hover{transform:rotate(0) scale(1.04)}
.gal img{border:0;border-radius:8px}
.empty::before{content:'🗂️';display:block;font-size:42px;margin-bottom:6px}
.empty{border-radius:16px;padding:30px 12px}
.strip{max-width:880px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:flex-end}
.gear{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 14px 6px 10px;cursor:pointer;font-weight:600;font-size:14px;box-shadow:0 2px 0 var(--bd)}
.gear svg{width:22px;height:22px;transition:transform .4s}
.gear:hover svg{transform:rotate(45deg)}
.gear.on{background:#16794c;border-color:#16794c;color:#fff}
.adm{background:var(--card);color:var(--tx);border-radius:20px;padding:24px 22px;width:min(92vw,340px);text-align:center}
.adm h3{margin:0 0 6px;font-size:22px}
.adm p{margin:0 0 14px;color:var(--mut);font-size:14px}
.adm input{width:100%;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);margin-bottom:12px;font-size:16px;text-align:center;letter-spacing:2px}
.adm input.bad{border-color:var(--red)}
.adm .row{justify-content:center}
.toast.ok{background:#16794c}
.login .btn+.btn{margin-top:10px}
</style>
</head>
<body>
<div class="strip"><button id="gear" class="gear" type="button" aria-label="وضع المشرف"><svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><circle cx="50" cy="50" r="24" fill="none" stroke="currentColor" stroke-width="20"/><rect x="44" y="6" width="12" height="16" rx="2"/><rect x="44" y="6" width="12" height="16" rx="2" transform="rotate(45 50 50)"/><rect x="44" y="6" width="12" height="16" rx="2" transform="rotate(90 50 50)"/><rect x="44" y="6" width="12" height="16" rx="2" transform="rotate(135 50 50)"/><rect x="44" y="6" width="12" height="16" rx="2" transform="rotate(180 50 50)"/><rect x="44" y="6" width="12" height="16" rx="2" transform="rotate(225 50 50)"/><rect x="44" y="6" width="12" height="16" rx="2" transform="rotate(270 50 50)"/><rect x="44" y="6" width="12" height="16" rx="2" transform="rotate(315 50 50)"/></svg><span>المشرف</span></button></div>
<div id="app"></div>
<script>
const SUBJ=[
['math','الرياضيات','📐','#2f6fed'],['sci','العلوم الطبيعية','🧬','#0f9d6b'],['phy','الفيزياء','⚛️','#7c4dff'],
['phi','الفلسفة','🤔','#e08a00'],['fr','اللغة الفرنسية','Fr','#d64550'],['en','اللغة الإنجليزية','En','#0aa5c0'],
['his','التاريخ','🏛️','#a0592a'],['geo','الجغرافيا','🌍','#3c9a2f'],['isl','العلوم الإسلامية','🕌','#13867a']];
const $=s=>document.querySelector(s),app=$('#app');
// ضع هنا رابط Cloudflare Worker بعد نشره. لا تضع أي مفتاح GitHub في هذا الملف.
const API_BASE='https://YOUR-WORKER.workers.dev';
let ADMIN_KEY='';
async function api(path,options={}){
  if(API_BASE.includes('YOUR-WORKER')) throw new Error('يجب إعداد رابط الخادم في متغير API_BASE داخل index.html أولاً.');
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  const r=await fetch(API_BASE+path,{...options,headers});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||'تعذر الاتصال بالخادم');
  return data;
}
async function fetchImages(subject,type){const r=await api(`/api/images?subject=${encodeURIComponent(subject)}&type=${encodeURIComponent(type)}`);return r.items||[];}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* storage: IndexedDB with in-memory fallback */
const mem={};let dbp=null;
const db=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('kerrasi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
async function get(k){if(k in mem)return mem[k];try{const d=await db();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})}catch(e){return undefined}}
async function set(k,v){mem[k]=v;try{const d=await db();return await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false);t.onabort=()=>r(false)})}catch(e){return false}}
const S={students:[],cur:null,subj:null,tab:'l',admin:false,data:{l:[],e:[]}};
const key=(t,s=S.subj)=>`img|${s}|${t}`;
const oldKey=(t,s=S.subj)=>`img|${S.cur}|${s}|${t}`;
function toast(m,ok){const t=document.createElement('div');t.className='toast'+(ok?' ok':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
/* views */
function login(){
  app.innerHTML=`<div class="login"><div class="logo">🎓</div><h1>كراسي</h1><p>اكتب اسمك للدخول</p>
  <input id="nm" placeholder="اكتب اسم التلميذ" maxlength="40"><button class="btn" data-a="go">دخول</button></div>`;
}
async function home(){
  S.subj=null;
  const C=Object.fromEntries(await Promise.all(SUBJ.map(async s=>{try{return [s[0],[(await fetchImages(s[0],'l')).length,(await fetchImages(s[0],'e')).length]]}catch(_){return [s[0],[0,0]]}})));
  app.innerHTML=`<div class="top hero"><div><small>مرحباً بك</small><h2>${esc(S.cur)}</h2><p>اختر المادة لتفتح دروسك وتمارينك</p></div><button class="ghost" data-a="out">🚪 تسجيل خروج</button></div>
  <div class="subs">${SUBJ.map((s,i)=>`<button class="sub" style="--c:${s[3]};--i:${i}" data-a="open" data-id="${s[0]}"><span class="ic">${s[2]}</span><b>${s[1]}</b><span class="cnt"><span>📘 ملخصات ودروس <i>${C[s[0]][0]}</i></span><span>✏️ تمارين <i>${C[s[0]][1]}</i></span></span></button>`).join('')}</div>`;
}
async function openSubject(id){
  S.subj=id;S.tab='l';
  app.innerHTML='<p class="empty">جارٍ تحميل الصور من GitHub...</p>';
  try { S.data={l:await fetchImages(id,'l'),e:await fetchImages(id,'e')}; subject(); }
  catch(e){toast('تعذر تحميل الصور: '+e.message);S.data={l:[],e:[]};subject();}
}
function subject(){
  const s=SUBJ.find(x=>x[0]===S.subj),L=S.data[S.tab];
  app.innerHTML=`<div style="--c:${s[3]}"><div class="top banner"><button class="ghost" data-a="home">→ رجوع</button><h2>${s[2]} ${s[1]}</h2></div>
  <div class="tabs"><button class="${S.tab=='l'?'on':''}" data-a="tab" data-t="l">📘 ملخصات ودروس (${S.data.l.length})</button><button class="${S.tab=='e'?'on':''}" data-a="tab" data-t="e">✏️ تمارين (${S.data.e.length})</button></div>
  <div class="panel"><div class="bar"><b>${S.tab=='l'?'ملخصات ودروس':'تمارين'} ${s[1]}</b><label class="btn">📷 رفع صور<input id="up" type="file" accept="image/*" multiple hidden></label></div>
  ${L.length?`<div class="gal">${L.map((x,i)=>`<figure><img src="${x.d}" alt="صورة رفعها ${esc(x.by||'')}" data-a="view" data-i="${i}"><figcaption>👤 ${esc(x.by||'غير معروف')}</figcaption></figure>`).join('')}</div>`:`<p class="empty">لا توجد صور بعد. اضغط على «رفع صور» لإضافة صور ${S.tab=='l'?'الدروس والملخصات':'التمارين'}.</p>`}</div></div>`;
}
function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)})}
function lightbox(i){
  const x=S.data[S.tab][i];let ask=false;
  const d=document.createElement('div');d.className='lb';
  d.innerHTML=`<img src="${x.d}" alt=""><div style="color:#fff;font-weight:600">👤 رفعها: ${esc(x.by||'غير معروف')}${x.t?' – '+new Date(x.t).toLocaleDateString('ar-DZ'):''}</div><div class="row">${S.admin?'<button class="btn del" data-x="del">🗑 حذف</button>':''}<button class="btn alt" data-x="close" style="color:#fff;border-color:#fff">إغلاق</button></div>`;
  d.addEventListener('click',async e=>{
    const a=e.target.closest('[data-x]');
    if(e.target===d||(a&&a.dataset.x=='close'))return d.remove();
    if(a&&a.dataset.x=='del'){
      if(!ask){ask=true;a.textContent='تأكيد الحذف';return}
      try{await api('/api/images',{method:'DELETE',headers:{'X-Admin-Key':ADMIN_KEY},body:JSON.stringify({path:x.path,sha:x.sha})});S.data[S.tab].splice(i,1);d.remove();subject();toast('تم حذف الصورة من GitHub',1)}catch(err){toast('تعذر الحذف: '+err.message)}
    }});
  document.body.appendChild(d);
}
/* names */
const norm=s=>s.toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
/* admin */

function setAdmin(v){S.admin=v;const g=$('#gear');g.classList.toggle('on',v);g.querySelector('span').textContent=v?'وضع المشرف مفعّل':'المشرف'}
function adminAsk(){
  if(S.admin){setAdmin(false);return toast('تم الخروج من وضع المشرف',1)}
  const d=document.createElement('div');d.className='lb';
  d.innerHTML=`<div class="adm"><h3>🔒 وضع المشرف</h3><p>أدخل كلمة السر لتفعيل صلاحيات الحذف الكاملة.</p><input id="pw" type="password" placeholder="كلمة السر" autocomplete="off"><div class="row"><button class="btn" data-x="ok">تفعيل</button><button class="btn alt" data-x="no">إلغاء</button></div></div>`;
  const pw=d.querySelector('#pw');
  const go=async()=>{try{const key=pw.value.trim();const result=await api('/api/admin-check',{method:'POST',body:JSON.stringify({key})});if(result.ok){ADMIN_KEY=key;setAdmin(true);d.remove();toast('تم تفعيل وضع المشرف. يمكنك الآن حذف الصور من GitHub.',1)}else{pw.value='';pw.placeholder='كلمة السر غير صحيحة';pw.classList.add('bad')}}catch(err){pw.value='';pw.placeholder='تعذر التحقق: '+err.message;pw.classList.add('bad')}};
  d.addEventListener('click',e=>{const a=e.target.closest('[data-x]');if(e.target===d||(a&&a.dataset.x=='no'))d.remove();else if(a&&a.dataset.x=='ok')go()});
  pw.addEventListener('keydown',e=>{if(e.key=='Enter')go()});
  document.body.appendChild(d);pw.focus();
}
$('#gear').addEventListener('click',adminAsk);
/* events */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='go'){
    const v=$('#nm').value.replace(/\s+/g,' ').trim();if(!v)return toast('اكتب اسم التلميذ أولاً');
    const f=S.students.find(n=>norm(n)===norm(v));
    if(f)S.cur=f;else{S.students.push(v);await set('students',S.students);S.cur=v}
    await set('current',S.cur);home()}
  else if(a=='out'){S.cur=null;setAdmin(false);await set('current','');login()}
  else if(a=='open')openSubject(b.dataset.id);
  else if(a=='home')home();
  else if(a=='tab'){S.tab=b.dataset.t;subject()}
  else if(a=='view')lightbox(+b.dataset.i);
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='up')return;
  const fs=[...e.target.files];if(!fs.length)return;
  const subjectId=S.subj,type=S.tab;let good=0,bad=0;
  toast('جارٍ رفع الصور إلى GitHub...');
  for(const f of fs){
    try{
      const data=await shrink(f);
      const result=await api('/api/images',{method:'POST',body:JSON.stringify({subject:subjectId,type,by:S.cur,data})});
      S.data[type].push(result.item);good++;
    }catch(err){bad++;console.error(err);}
  }
  S.data[type].sort((a,b)=>(a.t||0)-(b.t||0));subject();
  if(good)toast('تم رفع '+good+' صورة وحفظها في مستودع GitHub',1);
  if(bad)toast('تعذر رفع '+bad+' صورة. تحقق من إعداد الخادم وحجم الصور.');
  e.target.value='';
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='nm')document.querySelector('[data-a=go]').click()});
/* start */
(async()=>{
  S.students=(await get('students'))||[];
  const c=await get('current');
  if(c&&S.students.includes(c)){S.cur=c;home()}else login();
})();
</script>
</body>
